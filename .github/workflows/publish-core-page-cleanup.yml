name: publish latest hugo-stack artifact

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-core-page-cleanup.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-0d48-81fd-90db-14552e43ac3c/raw?se=2026-09-05T07%3A27%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=0746ae32-d57b-5ea0-8fa9-361d759d3bb9&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T00%3A51%3A56Z&ske=2026-09-06T00%3A51%3A56Z&sks=b&skv=2026-02-06&sig=LKXglW7Aww2N8n6FWPUUBHCC/wInTBfRxRcbfQ/mALc%3D'
      ARTIFACT_SHA256: 'a6d55d09cd7b067e6bce886ad671484fe5090f08b3bba079e47f7c41a2d6e906'

    steps:
      - name: Checkout generated site
        uses: actions/checkout@v7.0.1

      - name: Download and validate Hugo artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/hugo-public.zip
          echo "$ARTIFACT_SHA256  /tmp/hugo-public.zip" | sha256sum --check -
          rm -rf /tmp/hugo-public
          mkdir -p /tmp/hugo-public
          unzip -q /tmp/hugo-public.zip -d /tmp/hugo-public
          grep -q 'Hugo 0.165.0' /tmp/hugo-public/index.html
          test -s /tmp/hugo-public/robots.txt
          test -s /tmp/hugo-public/css/refresh.css
          grep -R -q '这是一个用 Hugo' /tmp/hugo-public
          grep -R -q '订阅本站最新文章' /tmp/hugo-public

      - name: Replace generated output
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/hugo-public/. .
          touch .nojekyll

      - name: Commit generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: sync hugo-stack@021c3f59"
          git push
